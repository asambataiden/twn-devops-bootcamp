version: '3.8'
services:
  java-maven-app:
    image: "${DOCKER_IMAGE_REPOSITORY}:${IMAGE_NAME}"

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-default}"

    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:15.3

    restart: unless-stopped

    environment:
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
      POSTGRES_DB: demo_db

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: